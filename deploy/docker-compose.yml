# Production stack: Caddy (HTTPS) -> Next.js app -> PostgreSQL.
# Run from this directory. Configure with `deploy/.env` (copy .env.example). See docs/deployment.md.
name: gfg

x-app-env: &app-env
  DATABASE_URL: postgres://gfg:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/gfg?sslmode=disable
  SITE_URL: https://${DOMAIN:?set DOMAIN}
  UPLOAD_DIR: /data/uploads

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gfg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gfg
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gfg -d gfg"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Runs once per `up`: applies pending migrations, then the idempotent seed (roles, pages, defaults, first admin).
  migrate:
    build: { context: .., target: tools }
    image: gfg-tools
    restart: "no"
    environment:
      <<: *app-env
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      SEED_RESET_SUPERADMIN: ${SEED_RESET_SUPERADMIN:-0}
    depends_on:
      db: { condition: service_healthy }

  app:
    build: { context: .., target: runner }
    image: gfg-app
    restart: unless-stopped
    environment: *app-env
    volumes:
      - uploads:/data/uploads
    # Not published: only Caddy can reach it, which is what makes the X-Real-IP header trustworthy.
    expose: ["3000"]
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app: { condition: service_healthy }

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
